<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Centro de Ayuda - TecnoBiobit</title>
<link rel="stylesheet" href="stylesayuda.css">
</head>
<body>
<header>
    <div class="logo">
    <img src="../Imagenes/logo.png" alt="Logo" class="header-logo" />
    <h1>TecnoBiobit</h1>
    </div>
    <div class="header-buttons">
    <button>Perfil</button>
    <button>Cerrar Sesión</button>
    </div>
</header>

<div class="container">
    <nav class="sidebar">
    <button>Agendar Cita</button>
    <button>Consultar/Gestionar cita</button>
    <button>Recetas médicas</button>
    <button class="active">Ayuda</button>
    </nav>

    <main class="main-content">
    <h2>Centro de ayuda</h2>

    <div class="switch-buttons">
        <button class="active">Preguntas Frecuentes</button>
        <button>Soporte Técnico:</button>
    </div>

    <div class="faq-list">
        <button class="faq-item">¿Cómo agendo una cita médica?</button>
        <button class="faq-item">¿Cómo pago mi consulta?</button>
        <button class="faq-item">¿Puedo cancelar o reagendar una cita?</button>
        <button class="faq-item">¿Cómo accedo a mi consulta en línea?</button>
        <button class="faq-item">¿Cómo consulto mis recetas médicas?</button>
        <button class="faq-item">¿Cómo contacto a soporte técnico?</button>
    </div>

    <div class="acciones">
        <button>Ir al Menú</button>
    </div>
    </main>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Registro de Usuario</title>
<link rel="stylesheet" href="styles1.css">
</head>
<body>
<header>
    <div class="logo"></div>
    <h1>Registro de Usuario</h1>
</header>

<main>
    <form class="formulario">
    <h2>Datos Generales</h2>

    <input type="text" placeholder="Nombre(s)">
    
    <div class="input-doble">
        <input type="text" placeholder="Apellido Paterno">
        <input type="text" placeholder="Apellido Materno">
    </div>

    <input type="text" placeholder="CURP">

    <label class="label-fecha">Fecha de nacimiento:</label>
    <div class="input-triple">
        <select><option>Día</option></select>
        <select><option>Mes</option></select>
        <select><option>Año</option></select>
    </div>

    <label class="label-genero">Género:</label>
    <select>
        <option>Masculino/ Femenino</option>
    </select>

    <label class="label-direccion">Dirección:</label>
    <select><option>Estado</option></select>

    <div class="input-doble">
        <select><option>Municipio</option></select>
        <input type="text" placeholder="Código Postal">
    </div>

    <select><option>Colonia</option></select>

    <div class="input-doble">
        <input type="text" placeholder="Calle">
        <input type="text" placeholder="Nº">
    </div>

    <a href="../registro/registro2.html" class="btn-siguiente">Siguiente</a>
    </form>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recetas Médicas - TecnoBiobit</title>
<link rel="stylesheet" href="stylesrecetas.css">
</head>
<body>
<header>
    <div class="logo">
    <img src="../Imagenes/logo.png" alt="Logo" class="header-logo" />
    <h1>TecnoBiobit</h1>
    </div>
    <div class="header-buttons">
    <button>Perfil</button>
    <button>Cerrar Sesión</button>
    </div>
</header>

<div class="container">
    <nav class="sidebar">
    <button>Agendar Cita</button>
    <button>Consultar/Gestionar cita</button>
    <button class="active">Recetas médicas</button>
    <button>Ayuda</button>
    </nav>

    <main class="main-content">
    <h2>Recetas Médicas</h2>
    <div class="switch-buttons">
        <button class="active">Recetas Médicas</button>
    </div>

    <div class="recetas-lista">
        <div class="receta">
        <input type="text" placeholder="Día / Mes / Año">
        <input type="text" placeholder="Nombre y especialidad">
        <div class="tags">
            <span>Agendada</span>
            <span>Pendiente</span>
            <span>Realizada</span>
        </div>
        </div>

        <div class="receta">
        <input type="text" placeholder="Día / Mes / Año">
        <input type="text" placeholder="Nombre y especialidad">
        <div class="tags">
            <span>Agendada</span>
            <span>Pendiente</span>
            <span>Realizada</span>
        </div>
        </div>

        <!-- Puedes duplicar más bloques .receta si quieres más filas -->
    </div>

    <div class="acciones">
        <button>Ir al Menú</button>
        <button>Seleccionar</button>
    </div>
    </main>
</div>
</body>
</html>

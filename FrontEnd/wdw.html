<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Videollamada con Jitsi</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f2f2f2;
    }
    .container {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="jitsi-container" class="container"></div>

  <script src="https://meet.jit.si/external_api.js"></script>
  <script>
    const domain = "meet.jit.si";
    const options = {
      roomName: "consulta_prueba_12345", // CAMBIA ESTE NOMBRE PARA OTRA SALA
      width: "100%",
      height: "100%",
      parentNode: document.querySelector('#jitsi-container'),
      configOverwrite: {},
      interfaceConfigOverwrite: {}
    };
    const api = new JitsiMeetExternalAPI(domain, options);
  </script>
</body>
</html>

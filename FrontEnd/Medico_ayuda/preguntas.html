<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Centro de Ayuda - TecnoBiobit</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <img src="../Imagenes/logo.png" alt="Logo" class="header-logo">
        <div class="titulo">TecnoBiobit</div>
        <div class="header-buttons">
            <button class="btn-secundario">Perfil</button>
            <button class="btn-secundario">Cerrar Sesión</button>
        </div>
    </div>

    <div class="contenedor-principal">
        <div class="sidebar">
            <button class="btn-menu">Membresía</button>
            <button class="btn-menu">Gestión de Citas</button>
            <button class="btn-menu">Recetas médicas</button>
            <button class="btn-menu seleccionado">Ayuda</button>
        </div>

        <div class="contenido">
            <h2 class="seccion-titulo">Centro de ayuda</h2>

            <div class="contenedor-tabs">
                <button class="tab seleccionado">Preguntas Frecuentes</button>
                <div class="flechas-tab">▲<br>▼</div>
                <button class="tab">Soporte Técnico:</button>
                <div class="flechas-tab">▲<br>▼</div>
            </div>

            <div class="preguntas">
                <div class="pregunta">¿Cómo atiendo una cita médica? <span class="desplegable">▼</span></div>
                <div class="pregunta">¿Cómo pago mi membresía? <span class="desplegable">▼</span></div>
                <div class="pregunta">¿Puedo cancelar o reagendar una cita? <span class="desplegable">▼</span></div>
                <div class="pregunta">¿Cómo accedo a mi consulta en línea? <span class="desplegable">▼</span></div>
                <div class="pregunta">¿Cómo envío recetas médicas? <span class="desplegable">▼</span></div>
                <div class="pregunta">¿Cómo contacto a soporte técnico? <span class="desplegable">▼</span></div>
            </div>

            <div class="botones-accion">
                <button class="btn-principal">Ir al Menú</button>
            </div>
        </div>
    </div>
</body>
</html>

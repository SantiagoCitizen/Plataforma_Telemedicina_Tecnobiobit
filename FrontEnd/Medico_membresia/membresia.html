<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Membresía - TecnoBiobit</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <img src="../Imagenes/logo.png" alt="Logo" class="header-logo">
        <div class="titulo">TecnoBiobit</div>
        <div class="header-buttons">
            <button class="btn-secundario">Perfil</button>
            <button class="btn-secundario">Cerrar Sesión</button>
        </div>
    </div>

    <div class="contenedor-principal">
        <div class="sidebar">
            <button class="btn-menu seleccionado">Membresía</button>
            <button class="btn-menu">Gestión de Citas</button>
            <button class="btn-menu">Recetas médicas</button>
            <button class="btn-menu">Ayuda</button>
        </div>

        <div class="contenido">
            <h2 class="seccion-titulo">Membresía</h2>

            <div class="tarjeta-membresia">
                <img src="../Imagenes/logo.png" alt="Logo" class="logo-membresia">
                <h3>Premium</h3>
                <p class="precio">$</p>
                <ul>
                    <li>Una cuenta premium</li>
                    <li>Pago por suscripción</li>
                    <li>Cancela en cualquier momento</li>
                </ul>
                <button class="btn-obtener">Obtener premium</button>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inicio de Sesión</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- NUEVO HEADER -->
<header class="main-header">
<div class="logo-container">
    <img src="../Imagenes/logo.png" alt="Logo" class="header-logo" />
    <span class="platform-name">TecnoBiobit</span>
</div>
</header>

<!-- TU CÓDIGO ORIGINAL SIGUE INTACTO -->
<div class="login-container">
    <h2>Inicio Sesión.</h2>
    
    <div class="login-box">
    <div class="logo">
        <img src="../Imagenes/logo.png" alt="Logo" />
    </div>

    <form class="form">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Ingresa tu usuario" />

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Ingresa tu contraseña" />

        <div class="buttons">
        <button type="button" class="secondary">Olvidaste contraseña</button>
        <button type="submit" class="primary">Entrar</button>
        </div>
    </form>
    </div>
</div>
</body>
</html>
